version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      app-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "@opennextjs/cloudflare"
          - "@simplewebauthn/*"
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - server-only
        update-types:
          - minor
          - patch
      tooling-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - eslint-config-next
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /maintenance/d1-rest-adapter
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      tooling-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /maintenance/maintenance-cli
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      tooling-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The relay currently has no third-party modules; cover future additions.
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
